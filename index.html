<!DOCTYPE HTML>

<html>
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightpick@1.6.2/css/lightpick.min.css">
  <title>TimeEventAnnouncer</title>
</head>

<body>
<main class="pt-6">

</main>
<div class="container is-max-tablet">
  <section>
    <div class="card">
      <header class="card-header">
        <p class="card-header-title">設定</p>
      </header>
      <div class="card-content">
        <!-- region #アラート音声 -->
        <div class="field is-horizontal">
          <div class="field-label is-normal">
            <label class="label">アラーム音声</label>
          </div>
          <div class="field-body">
            <div class="field">
              <div class="control is-expanded">
                <input class="input" type="text" placeholder="アラート音声を入力してください。" />
              </div>
            </div>
          </div>
        </div>
        <!-- endregion -->

        <!-- region #期間 -->
        <div class="field is-horizontal">
          <div class="field-label is-normal">
            <label class="label">期間</label>
          </div>
          <div class="field-body">
            <div class="field">
              <div class="control is-expanded">
                <input class="input" type="text" id="date_from" readonly />
              </div>
            </div>
            <div class="field">
              <p class="title is-5 is-flex is-justify-content-center is-align-items-center" style="height: 100%;">～</p>
            </div>
            <div class="field">
              <div class="control is-expanded">
                <input class="input" type="text" id="date_till" readonly />
              </div>
            </div>
          </div>
        </div>
        <!-- endregion -->

        <!-- region #時刻-->
        <div class="field is-horizontal">
          <div class="field-label is-normal">
            <label class="label">時刻</label>
          </div>
          <div class="field-body">
            <div class="field">
              <div class="control">
                <input class="input" type="time" id="time_announce" />
              </div>
            </div>
          </div>
        </div>
        <!-- endregion -->

        <div class="field is-grouped is-grouped-centered">
          <div class="control">
            <button type="button" class="button is-link">
              保存
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>


<!--  <button id="btn-download">download & save</button>-->
<!--  <button id="btn-play">play</button>-->
</div>

<script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/lightpick@1.6.2/lightpick.min.js"></script>
<script src="app.js"></script>

</body>
</html>
